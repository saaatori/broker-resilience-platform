version: '3'

tasks:
  install:
    desc: 安装前端依赖
    dir: frontend
    cmds:
      - npm install

  dev:frontend:
    desc: 启动前端开发服务器（Vite）
    dir: frontend
    cmds:
      - npm run dev

  dev:backend:
    desc: 启动后端开发服务器（air 热重载）
    dir: backend
    cmds:
      - air -c .air.toml

  up:
    desc: 启动平台基础设施（Compose：PG/Redis/go/agent/frontend）
    cmds:
      # --env-file 必须带：缺了会用空变量重建容器（go 的 fail-fast 将崩溃循环）
      - docker compose -f deploy/compose/platform.yml --env-file deploy/env/.env up -d

  down:
    desc: 停止平台基础设施（数据卷保留）
    cmds:
      - docker compose -f deploy/compose/platform.yml --env-file deploy/env/.env down

  test:
    desc: 运行全部单元测试
    cmds:
      - task: test:backend
      - task: test:agent
      - task: test:lab

  test:backend:
    desc: Go 单元测试
    dir: backend
    cmds:
      - go test ./...

  test:agent:
    desc: Agent 单元测试
    dir: agent
    cmds:
      # uv run 走项目环境（.venv：docker/pyyaml/pytest/jsonschema）——裸 pytest 在未激活 venv 的终端会解析到
      # 全局 Python 而缺 docker 包（双 Python 并存，排障手册 #5 同族）
      - uv run pytest tests

  test:lab:
    desc: lab 宿主单测（仓库根 pytest.ini 收 lab/tests；复用 agent 项目环境，pika 为延迟导入无需安装）
    cmds:
      - uv run --project agent pytest

  lint:
    desc: 代码检查（golangci-lint / ruff / eslint）
    cmds:
      - task: lint:backend
      - task: lint:agent
      - task: lint:frontend

  lint:backend:
    dir: backend
    cmds:
      - golangci-lint run ./...

  lint:agent:
    dir: agent
    cmds:
      - ruff check .

  lint:frontend:
    dir: frontend
    cmds:
      - npm run lint

  fmt:
    desc: 格式化全部代码
    cmds:
      - cmd: gofmt -l -w backend
      - cmd: ruff format agent
