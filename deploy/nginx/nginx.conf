# BRP 平台入口 nginx（挂载于 frontend 服务，工程目录结构 §3.2 deploy/nginx）
# 职责：前端静态资源 + /api 反代 brp-go + SSE 转发预备（M2 任务进度推送）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：react-router 的所有前端路径都回 index.html（/api 除外，见下）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到 go 控制面：路径原样透传（go 收到 /api/v1/...）
    location /api/ {
        proxy_pass http://go:8080; # compose 服务名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 预备（M2 生效）：关缓冲 + 长读超时，事件推送不被 nginx 攒包
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
