# BRP 平台入口 nginx（挂载于 frontend 服务，工程目录结构 §3.2 deploy/nginx）
# 职责：前端静态资源 + /api 反代 brp-go + SSE 转发预备（M2 任务进度推送）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：react-router 的所有前端路径都回 index.html（/api 除外，见下）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent 协议端点只在平台内网可达：Agent 容器直连 go:8080（compose 服务名），不经本入口。
    # 对外一律 404、不转发——/agent/register 无鉴权，若透传则 :80 入口可冒充 Agent 领任务。
    # ^~：命中这两个前缀后不再查正则 location（日后加正则规则也抢不走）；前缀取最长者，两段都比 /api/ 长。
    # 注意：面向前端的接口不要再放进这两个前缀下，会被一并屏蔽。
    # 仅 compose 形态受此保护：task dev:backend 开发态下 Go 直接监听宿主机 :8080。
    location ^~ /api/v1/agent/      { return 404; }
    location ^~ /api/v1/executions/ { return 404; }

    # /api 反代到 go 控制面：路径原样透传（go 收到 /api/v1/...）
    location /api/ {
        proxy_pass http://go:8080; # compose 服务名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 预备（M2 生效）：关缓冲 + 长读超时，事件推送不被 nginx 攒包
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
