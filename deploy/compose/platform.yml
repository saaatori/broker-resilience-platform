# 平台运行环境（常驻）—— PostgreSQL + Redis + go 控制面 + agent（M2 第 38 天起为真实主循环）+ nginx（前端静态资源 + /api 反代）
# 后续里程碑逐步加入：prometheus（M4）
# 启动：task up   或   docker compose -f deploy/compose/platform.yml --env-file deploy/env/.env up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: brp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    ports:
      # 只绑本机回环：供本机 Go 进程 / DBeaver / 集成测试连接。需从别的设备访问时改成 "0.0.0.0:5432:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ 官方镜像要求挂载父目录（数据实际存放在其下的版本子目录）
      - brp_pgdata:/var/lib/postgresql
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: brp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      # 只绑本机回环（同 postgres）：供本机 go run 与集成测试连接，localhost 与 127.0.0.1 连到的都是这个容器。
      # 2026-11-24 曾绑不上——本机禅道自带的 Redis 服务（rediszt3）占着 127.0.0.1:6379；该服务停用并改为
      # 手动启动（2026-11-25）后才收紧。若它再被启用，这里会端口冲突，redis 及排在其后的 go 都起不来（排障 #43）。
      # 需从别的设备访问时改成 "0.0.0.0:6379:6379"
      - "127.0.0.1:6379:6379"
    volumes:
      - brp_redisdata:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  go:
    build: ../../backend
    image: brp-backend:dev
    container_name: brp-go
    restart: unless-stopped
    environment:
      # 容器内 DSN 用服务名 postgres；迁移（AutoMigrate）随服务启动执行
      BRP_DATABASE_DSN: "host=postgres port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable TimeZone=Asia/Shanghai"
      BRP_AUTH_JWT_SECRET: ${BRP_AUTH_JWT_SECRET}
      BRP_INSTANCE_ENCRYPT_KEY: ${BRP_INSTANCE_ENCRYPT_KEY}
      # 种子管理员口令：无默认值——未在 .env 配置时为空，go 启动 fail-fast 拒绝（不静默回退默认口令）
      BRP_AUTH_SEED_USERNAME: ${BRP_AUTH_SEED_USERNAME:-admin}
      BRP_AUTH_SEED_PASSWORD: ${BRP_AUTH_SEED_PASSWORD}
      # Redis（第 33 天）：缓存类键（agent:hb 等），容器网内服务名直连
      BRP_REDIS_ADDR: "redis:6379"
      BRP_REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 不映射宿主机：API 统一走 frontend(nginx) 的 :80 入口；本地 go run 也不再端口冲突
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    # 构建上下文=仓库根：lab/ 与 deploy/ 模板同装进镜像（day23 M-10 / day40）
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    image: brp-agent:dev
    container_name: brp-agent
    restart: unless-stopped
    # 固定容器主机名：Agent 以 hostname 为注册幂等键（协议 §2.1，同 hostname 复用 agent_id）。
    # 不固定则是容器 ID，每次重建都变——每次 up --build 都会多出一行 agent_instance。
    hostname: brp-agent
    # tini 作 PID 1（day42）：裸 Python 作 PID 1 时内核不给它装默认信号 handler——
    # 容器内 kill 不死它（SIGKILL 也被丢），失联实验无从做起；docker kill 又是手动操作
    # （unless-stopped 不重启）。tini 转发信号 + 回收僵尸（顺带解 day40 记档的孙进程风险）。
    init: true
    depends_on:
      # 等 go 健康检查通过再起：只保证启动顺序的话，Agent 每次启动都会先撞上一次"连接被拒"再退避重试
      go:
        condition: service_healthy
    volumes:
      # docker.sock：agent 经 Docker SDK 拉起/销毁实验容器（label 白名单，决策 8）
      - /var/run/docker.sock:/var/run/docker.sock
      # 执行工作目录（params.json / 渲染件 / pytest.log / results.json；runner WORK_ROOT=/work）
      - brp_agent_work:/work
    networks:
      - platform-net

  frontend:
    # nginx 托管前端静态产物 + /api 反代 brp-go（第 13 天的 nginx 占位服务升级而来）
    build: ../../frontend
    image: brp-frontend:dev
    container_name: brp-frontend
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 平台入口只绑本机回环（登录限流按用户名计数，对外暴露等于把管理员锁门外的人也放进局域网）。
      # 需从别的设备访问页面时改成 "0.0.0.0:80:80"
      - "127.0.0.1:80:80"
    depends_on:
      - go
    networks:
      - platform-net

networks:
  platform-net:
    name: platform-net       # 平台服务专用网络（与实验网络 brp_task_* 隔离）

volumes:
  brp_pgdata:
    name: brp_pgdata
  brp_redisdata:
    name: brp_redisdata
  brp_agent_work:
    name: brp_agent_work
