# 平台运行环境（常驻）—— PostgreSQL + Redis + go 控制面 + agent 占位 + nginx 占位
# 后续里程碑逐步加入：prometheus（M4）；nginx 第 14 天接入 /api 反代与前端静态资源
# 启动：task up   或   docker compose -f deploy/compose/platform.yml --env-file deploy/env/.env up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: brp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"          # 开发期映射到宿主机，供本机 Go 进程连接
    volumes:
      # PG 18+ 官方镜像要求挂载父目录（数据实际存放在其下的版本子目录）
      - brp_pgdata:/var/lib/postgresql
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: brp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"          # 开发期映射到宿主机
    volumes:
      - brp_redisdata:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  go:
    build: ../../backend
    image: brp-backend:dev
    container_name: brp-go
    restart: unless-stopped
    environment:
      # 容器内 DSN 用服务名 postgres；迁移（AutoMigrate）随服务启动执行
      BRP_DATABASE_DSN: "host=postgres port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable TimeZone=Asia/Shanghai"
      BRP_AUTH_JWT_SECRET: ${BRP_AUTH_JWT_SECRET}
      BRP_INSTANCE_ENCRYPT_KEY: ${BRP_INSTANCE_ENCRYPT_KEY}
    ports:
      - "8080:8080"          # 开发期映射（第 14 天 nginx 就位后可收掉）
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: ../../agent
    image: brp-agent:dev
    container_name: brp-agent
    restart: unless-stopped
    depends_on:
      - go
    networks:
      - platform-net

  nginx:
    image: nginx:1.27-alpine
    container_name: brp-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - go
    networks:
      - platform-net

networks:
  platform-net:
    name: platform-net       # 平台服务专用网络（与实验网络 brp_task_* 隔离）

volumes:
  brp_pgdata:
    name: brp_pgdata
  brp_redisdata:
    name: brp_redisdata
