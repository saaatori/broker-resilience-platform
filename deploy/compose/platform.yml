# 平台运行环境（常驻）—— 最小启动集：PostgreSQL + Redis
# 后续里程碑逐步加入：nginx / go / agent / prometheus（见总体设计表 10）
# 启动：task up   或   docker compose -f deploy/compose/platform.yml up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: brp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"          # 开发期映射到宿主机，供本机 Go 进程连接
    volumes:
      # PG 18+ 官方镜像要求挂载父目录（数据实际存放在其下的版本子目录）
      - brp_pgdata:/var/lib/postgresql
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: brp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"          # 开发期映射到宿主机
    volumes:
      - brp_redisdata:/data
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  platform-net:
    name: platform-net       # 平台服务专用网络（与实验网络 brp_task_* 隔离）

volumes:
  brp_pgdata:
    name: brp_pgdata
  brp_redisdata:
    name: brp_redisdata
