[project]
name = "brp-agent"
version = "0.1.0"
description = "BRP 执行面 Agent（Python）：注册/心跳/领取/执行/回传（M2 起实现）"
requires-python = ">=3.13"
# envmgr（第 17 天）引入 docker/pyyaml（实验环境拉起）；executor（第 38 天）引入 requests（控制面 HTTP 客户端，
# 此前只作为 docker 的传递依赖出现在锁内）；pika/fastapi 仍按计划后续引入并锁定
dependencies = [
    "docker>=7,<8",
    "pyyaml>=6,<7",
    "requests>=2.34,<3",
]

[tool.uv]
# 纯依赖环境（非可安装包），uv run 免构建直接装依赖
package = false

[dependency-groups]
# dev 组随 uv run 默认安装（day28 起：协议 schema 校验依赖 jsonschema[format]——
# format=date-time 校验需要 rfc3339-validator extra，否则 FormatChecker 对 date-time 是 no-op）
dev = [
    "pytest>=8,<10",
    "jsonschema[format]>=4,<5",
]

[tool.ruff]
line-length = 100
