# BRP 控制面配置模板 —— 复制为同目录 config.yaml 并修改（config.yaml 不入库）
#   cp configs/config.example.yaml configs/config.yaml

server:
  port: 8080

database:
  # DSN 中的 password 改为 deploy/env/.env 里的 POSTGRES_PASSWORD
  dsn: "host=localhost port=5432 user=brp password=CHANGE_ME dbname=broker_resilience sslmode=disable TimeZone=Asia/Shanghai"

auth:
  # 种子管理员：首次启动且库中无用户时写入；两项留空则回退 admin / admin123
  seed_username: "admin"
  seed_password: "CHANGE_ME"
  # JWT：密钥必填（本地随机串，openssl rand -hex 32 生成）；TTL 为 Go duration 格式，留空默认 24h
  jwt_secret: "CHANGE_ME"
  token_ttl: "24h"

instance:
  # 实例凭据 Fernet 密钥，必填（python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"）
  encrypt_key: "CHANGE_ME"
